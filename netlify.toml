# Kein echter Build: interne Dateien vor dem Hochladen löschen, damit sie 404 liefern:
# - alle *.md (z. B. /CLAUDE.md); Weiterleitungen können „*.md“ nicht abfangen
#   (Platzhalter nur am Ende eines Pfads)
# - /social/ (Vorlagen für Instagram-Karussells, keine Seiten der Website)
# Die Google-Verifizierungsdatei (google*.html) bleibt öffentlich.
[build]
  publish = "."
  command = "rm -rf social && find . -path ./.git -prune -o -type f -name '*.md' -print -delete"

# Service Worker und Manifest nie aus dem HTTP-Cache: sonst bleiben installierte Apps auf alten Versionen hängen
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type = "application/manifest+json"

# Altes Manifest (vor der PWA) zeigt auf das neue
[[redirects]]
  from = "/site.webmanifest"
  to = "/manifest.webmanifest"
  status = 301
