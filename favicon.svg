<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Gastrokniff" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Gastrokniff</title>
  <defs>
    <clipPath id="gk-tile"><rect x="0" y="0" width="100" height="100" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#gk-tile)">
    <rect x="0" y="0" width="100" height="100" fill="#211C16"/>
    <!-- Rueckseite der umgeknickten Ecke -->
    <path d="M66 0 L100 0 L100 34 Z" fill="#D9A34E"/>
    <!-- umgeknickte Ecke -->
    <path d="M66 0 L100 34 L66 34 Z" fill="#B57611"/>
    <!-- Knickkante -->
    <path d="M66 0 L66 34 L100 34" fill="none" stroke="#1B1712" stroke-width="1.6" opacity="0.35"/>
    <!-- K, geometrisch gezeichnet (keine Schriftart noetig) -->
    <g transform="translate(3,-2)" stroke="#F2F0EA" stroke-width="11" fill="none" stroke-linecap="butt">
      <path d="M26 34 L26 76"/>
      <path d="M27 55.5 L54 34"/>
      <path d="M27 55.5 L56 76"/>
    </g>
  </g>
</svg>
